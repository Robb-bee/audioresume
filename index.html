<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice to Resume</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #888; margin-bottom: 30px; }
        
        .card {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        .step { display: none; }
        .step.active { display: block; }
        
        .field { margin-bottom: 20px; }
        .field label { display: block; margin-bottom: 8px; color: #aaa; font-size: 0.9rem; }
        .field input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #333;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
        }
        .field input:focus { outline: none; border-color: #00d4ff; }
        
        .record-btn {
            width: 100%;
            padding: 60px;
            border: 2px dashed #333;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s;
            background: transparent;
        }
        .record-btn:hover, .record-btn.recording {
            border-color: #ff4444;
            background: rgba(255,68,68,0.1);
        }
        
        .transcript-box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            min-height: 100px;
            margin-bottom: 20px;
            color: #aaa;
            font-style: italic;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn.record { background: linear-gradient(90deg, #ff4444, #ff6666); }
        .btn.stop { background: #333; }
        
        .resume-preview {
            background: #fff;
            color: #000;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .resume-name { font-size: 1.4rem; font-weight: bold; }
        .resume-email { color: #666; font-size: 0.85rem; }
        .resume-section { margin-bottom: 15px; }
        .resume-section h4 { color: #333; font-size: 0.9rem; text-transform: uppercase; }
        .skills { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill-tag { background: #e0e0e0; padding: 4px 10px; border-radius: 15px; font-size: 0.8rem; }
        
        .error {
            background: rgba(255,0,0,0.1);
            border: 1px solid #ff4444;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #ff6666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Voice to Resume</h1>
        <p class="subtitle">Record your work experience. Get a professional resume.</p>
        
        <div class="card">
            <!-- Step 1: Record -->
            <div class="step active" id="step1">
                <div class="field">
                    <label>📧 Your email</label>
                    <input type="email" id="email" placeholder="you@example.com">
                </div>
                
                <button class="btn record" id="recordBtn">🎤 Tap to Record</button>
                
                <div class="transcript-box" id="transcriptBox">
                    Your transcript will appear here...
                </div>
                
                <button class="btn" id="generateBtn" disabled>Generate Resume</button>
                <div class="error" id="error1" style="display:none"></div>
            </div>
            
            <!-- Step 2: Processing -->
            <div class="step" id="step2">
                <div style="text-align:center;padding:60px 20px">
                    <div style="width:50px;height:50px;border:3px solid #333;border-top:3px solid #00d4ff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px"></div>
                    <p>Creating your resume...</p>
                </div>
            </div>
            
            <!-- Step 3: Resume Ready -->
            <div class="step" id="step3">
                <h3 style="margin-bottom:15px">✅ Your Resume is Ready!</h3>
                <div class="resume-preview" id="resumePreview"></div>
                <button class="btn" id="downloadBtn">Download PDF</button>
            </div>
        </div>
    </div>
    
    <script>
        const recordBtn = document.getElementById('recordBtn');
        const generateBtn = document.getElementById('generateBtn');
        const transcriptBox = document.getElementById('transcriptBox');
        const emailInput = document.getElementById('email');
        
        let recognition = null;
        let transcript = '';
        let isRecording = false;
        
        // Check browser support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            document.getElementById('error1').textContent = 'Speech recognition not supported in this browser. Try Chrome.';
            document.getElementById('error1').style.display = 'block';
            recordBtn.disabled = true;
        } else {
            setupRecognition();
        }
        
        function setupRecognition() {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            
            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const text = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        transcript += text + ' ';
                    } else {
                        interim += text;
                    }
                }
                transcriptBox.innerHTML = transcript + '<span style="color:#666">' + interim + '</span>';
            };
            
            recognition.onend = () => {
                if (isRecording) {
                    // Keep recording if still in recording mode
                    recognition.start();
                }
            };
        }
        
        recordBtn.onclick = () => {
            if (!isRecording) {
                // Start recording
                transcript = '';
                isRecording = true;
                recordBtn.textContent = '⏹️ Tap to Stop';
                recordBtn.classList.add('recording');
                transcriptBox.innerHTML = 'Listening...';
                try { recognition.start(); } catch(e) { setupRecognition(); recognition.start(); }
            } else {
                // Stop recording
                isRecording = false;
                recordBtn.textContent = '🎤 Tap to Record';
                recordBtn.classList.remove('recording');
                try { recognition.stop(); } catch(e) {}
                
                if (transcript.trim()) {
                    generateBtn.disabled = !emailInput.value.includes('@');
                }
            }
        };
        
        emailInput.oninput = () => {
            generateBtn.disabled = !(transcript.trim() && emailInput.value.includes('@'));
        };
        
        generateBtn.onclick = async () => {
            const email = emailInput.value.trim();
            if (!transcript.trim() || !email) return;
            
            showStep(2);
            
            try {
                // Generate resume (simple parsing, no AI API needed)
                const res = await fetch('/api/generate-resume', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transcript: transcript.trim(), email })
                });
                
                const data = await res.json();
                
                if (data.error) throw new Error(data.error);
                
                renderResume(data.resume);
                showStep(3);
                
            } catch (err) {
                document.getElementById('error1').textContent = err.message;
                document.getElementById('error1').style.display = 'block';
                showStep(1);
            }
        };
        
        function renderResume(resume) {
            document.getElementById('resumePreview').innerHTML = `
                <div class="resume-name">${resume.name || 'Your Name'}</div>
                <div class="resume-email">${resume.email || 'your@email.com'}</div>
                <div class="resume-section">
                    <h4>Summary</h4>
                    <p>${resume.summary || 'No summary'}</p>
                </div>
                <div class="resume-section">
                    <h4>Skills</h4>
                    <div class="skills">
                        ${(resume.skills || []).map(s => `<span class="skill-tag">${s}</span>`).join('')}
                    </div>
                </div>
            `;
        }
        
        function showStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
        }
        
        // Download PDF
        let currentResume = null;
        
        document.getElementById('generateBtn').onclick = async () => {
            // Store for PDF download
            const email = emailInput.value.trim();
            const res = await fetch('/api/generate-resume', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ transcript: transcript.trim(), email })
            });
            const data = await res.json();
            currentResume = data.resume;
        };
        
        document.getElementById('downloadBtn').onclick = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(22);
            doc.text(currentResume.name || 'Resume', 20, 20);
            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text(currentResume.email || '', 20, 28);
            doc.setFontSize(12);
            doc.setTextColor(0);
            doc.text('Summary', 20, 40);
            doc.setFontSize(10);
            doc.text(doc.splitTextToSize(currentResume.summary || '', 170), 20, 48);
            doc.setFontSize(12);
            doc.text('Skills', 20, 70);
            doc.setFontSize(10);
            doc.text((currentResume.skills || []).join(', '), 20, 78);
            doc.save(`${currentResume.name || 'resume'}.pdf`);
        };
    </script>
    
    <footer style="text-align:center;margin-top:40px;padding:20px;color:#666;font-size:0.85rem">
        <p style="margin-bottom:10px">
            <a href="/terms.html" style="color:#888;text-decoration:none;margin:0 10px">Terms of Service</a>
            <a href="/privacy.html" style="color:#888;text-decoration:none;margin:0 10px">Privacy Policy</a>
        </p>
    </footer>
</body>
</html>
