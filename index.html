<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turn Your Voice Into a Professional Resume</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #a0a0b0; margin-bottom: 30px; }
        
        .upload-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .field { margin-bottom: 20px; }
        .field label { display: block; margin-bottom: 8px; color: #a0a0b0; }
        .field input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4a4a6a;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
        }
        .field input:focus { outline: none; border-color: #00d4ff; }
        
        .drop-zone {
            border: 2px dashed #4a4a6a;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        .drop-zone:hover { border-color: #00d4ff; }
        
        .file-info {
            background: rgba(0,212,255,0.1);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .file-info.show { display: flex; justify-content: space-between; align-items: center; }
        
        .upload-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .success-message {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .success-message.show { display: block; }
        .success-message h2 { color: #00ff88; margin-bottom: 10px; }
        
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .upload-progress { display: none; text-align: center; padding: 30px; }
        .upload-progress.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Turn Your Voice Into a Resume</h1>
        <p class="subtitle">Record a short audio about your work experience. We'll turn it into a professional resume.</p>
        
        <div class="upload-section" id="uploadSection">
            <div class="field">
                <label>📧 Your email (for resume delivery)</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>
            
            <div class="drop-zone" id="dropZone">
                <p>📁 Drag & drop audio file here<br><small>or click to browse</small></p>
            </div>
            <input type="file" id="fileInput" accept="audio/*" style="display:none">
            
            <div class="file-info" id="fileInfo">
                <span id="fileName"></span>
                <button onclick="clearFile()" style="background:none;border:none;color:#ff6b6b;cursor:pointer">✕</button>
            </div>
            
            <button class="upload-btn" id="uploadBtn" disabled>Submit Audio</button>
        </div>
        
        <div class="upload-progress" id="uploadProgress">
            <div class="spinner"></div>
            <p>Uploading...</p>
        </div>
        
        <div class="success-message" id="successMessage">
            <h2>✅ Audio Submitted!</h2>
            <p>We'll process your resume and email you within 24 hours.</p>
        </div>
    </div>
    
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadSection = document.getElementById('uploadSection');
        const uploadProgress = document.getElementById('uploadProgress');
        const successMessage = document.getElementById('successMessage');
        const emailInput = document.getElementById('email');
        
        let selectedFile = null;
        
        // Click to browse
        dropZone.onclick = () => fileInput.click();
        
        // File selected
        fileInput.onchange = () => {
            if (fileInput.files[0]) handleFile(fileInput.files[0]);
        };
        
        function handleFile(file) {
            if (!file.type.startsWith('audio/')) {
                alert('Please upload an audio file');
                return;
            }
            selectedFile = file;
            fileName.textContent = file.name;
            fileInfo.classList.add('show');
            checkReady();
        }
        
        function clearFile() {
            selectedFile = null;
            fileInfo.classList.remove('show');
            fileInput.value = '';
            checkReady();
        }
        
        function checkReady() {
            const email = emailInput.value.trim();
            uploadBtn.disabled = !(selectedFile && email.includes('@'));
        }
        
        emailInput.oninput = checkReady;
        
        // Drag and drop
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor = '#00d4ff'; };
        dropZone.ondragleave = () => { dropZone.style.borderColor = '#4a4a6a'; };
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#4a4a6a';
            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        };
        
        // Upload - directly to file.io (bypasses Vercel size limit)
        uploadBtn.onclick = async () => {
            if (!selectedFile) return;
            
            const email = emailInput.value.trim();
            if (!email || !email.includes('@')) {
                alert('Please enter your email');
                return;
            }
            
            uploadSection.style.display = 'none';
            uploadProgress.classList.add('show');
            uploadProgress.querySelector('p').textContent = 'Uploading audio...';
            
            try {
                // Upload directly to file.io (bypasses Vercel)
                const formData = new FormData();
                formData.append('file', selectedFile);
                
                const uploadResponse = await fetch('https://file.io', {
                    method: 'POST',
                    body: formData
                });
                
                const uploadResult = await uploadResponse.json();
                
                if (!uploadResult.success) {
                    throw new Error('Upload to storage failed');
                }
                
                const fileUrl = uploadResult.file.url;
                console.log('File uploaded to:', fileUrl);
                
                // Now trigger transcription via our API
                uploadProgress.querySelector('p').textContent = 'Transcribing...';
                
                const transcribeResponse = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        fileUrl: fileUrl,
                        email: email
                    })
                });
                
                const result = await transcribeResponse.json();
                
                if (result.success) {
                    uploadProgress.classList.remove('show');
                    successMessage.classList.add('show');
                    console.log('Transcript:', result.transcript);
                } else {
                    throw new Error(result.error || 'Transcription failed');
                }
            } catch (err) {
                alert('Upload failed: ' + err.message);
                uploadProgress.classList.remove('show');
                uploadSection.style.display = 'block';
            }
        };
    </script>
</body>
</html>
